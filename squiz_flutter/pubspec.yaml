name: squiz
description: SQUIZ - Matric exam preparation and quizzes for Ethiopian students, Grades 9-12, with an administrator mode.
publish_to: none
version: 3.0.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/bank.json
    - assets/images/logo.png
